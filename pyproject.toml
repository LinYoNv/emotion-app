[project]
name = "emotion-app"
version = "0.1.0"
description = "潮汐引力 —— 自用虚拟聊天伙伴后端（爱语形态参照，Quart + SQLite）"
requires-python = ">=3.11"
dependencies = [
    "quart>=0.20",
    "hypercorn>=0.17",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    # ---- 2026-10-19：陪伴插件 7.0.0 的宿主侧依赖（实测逐个撞出来的）----
    # ⚠️ 这些不是"我们想加"，是**插件在 import 期就硬要**的：
    #    aiocqhttp     -> 插件顶层 `from aiocqhttp.api_impl import WebSocketReverseApi`
    #    sqlmodel      -> `from astrbot.core.db.po import ConversationV2`
    #    regex         -> companion_v2 的分段/文本处理（顶层 import）
    #    lunarcalendar -> 农历纪念日
    #    cryptography  -> 和风天气预警 JWT 签名
    #    google-genai  -> `from google.genai import types`（视频理解）
    #    defusedxml    -> RSS/资讯解析（顶层 import）
    #    mcp           -> `from mcp.types import CallToolResult`（工具结果）
    #    jsonschema    -> 工具参数校验
    #    其余是运行期可选能力的轻量依赖（惰性 import，缺了只影响对应功能）。
    "aiocqhttp>=1.4",
    "sqlmodel>=0.0.48",
    "regex>=2024.11.6",
    "lunarcalendar>=0.0.9",
    "lunardate>=0.3",
    "cryptography>=42",
    "google-genai>=2.31",
    "defusedxml>=0.7",
    "mcp>=1.26,<2",
    "jsonschema>=4.26",
    "brotli>=1.2",
    "psutil>=7",
    "pypinyin>=0.55",
    "qrcode>=8",
    "requests>=2.34",
    "starlette>=1.9",
    # ---- 2026-10-29：provider 端口的原生 client ----
    # 🔴 不是"可选增强"：陪伴 7.0.0 的 `AstrBotTextProvider`
    #    （`companion_v2/adapters/astrbot/provider.py:193`）直接读
    #    `native.client` 并 `with_options(max_retries=0)`，
    #    而 `client` 必须是**真的 OpenAI SDK 实例**（真实现
    #    `openai_source.py:384` 建的就是 `AsyncOpenAI`）。
    #    缺它 ⇒ 插件的后台任务/主动消息/日记/反思**全部起不来**，
    #    且加载期完全不报错（典型"加载全绿但功能从没通"）。
    "openai>=1.40",
    # ---- 2026-10-29：插件在 import 期就硬要、但原来漏声明的两项 ----
    # 🔴 实测（jp-vps 全新 venv，缺了就**整个插件加载失败**）：
    #    Pillow  -> `companion_v2/conversation/media/screen.py:11` `from PIL import Image`
    #               （顶层 import，陪伴主插件直接起不来）
    #    aiohttp -> `astrbot_plugin_nai_image/main.py:13` 与 together 插件顶层 import
    # ⚠️ 本机 venv 里早就有这两个（别的包带进来的），所以一直没发现
    #    —— 典型的"依赖靠传递关系碰巧满足"，换机器就炸。
    "Pillow>=12,<15",
    "aiohttp>=3.9",
    # pyyaml: 插件 metadata.yaml 的真实解析（缺了会退化到极简解析，
    # 且 nai_image 的 `main.py:14 from yaml` 是顶层 import → 整个插件起不来）。
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["emotion_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
